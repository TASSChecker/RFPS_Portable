name: Build RFPS Portable (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RFPS-Portable-Windows-x64
          path: build/Release/RFPS.exe
